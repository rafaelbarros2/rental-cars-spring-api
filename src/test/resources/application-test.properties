# ===========================================
# CONFIGURAÇÃO COMPLETA PARA TESTES
# ===========================================

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.sql.init.platform=h2

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Transaction Configuration

spring.jpa.properties.hibernate.connection.autocommit=false
spring.transaction.default-timeout=30
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# H2 Console (para debug se necessário)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Security Configuration (desabilitada para testes)
spring.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Web Configuration
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.servlet.context-path=

spring.liquibase.bean-name=liquibase
spring.liquibase.enabled=false
spring.liquibase.clear-missing-objects=false
spring.datasource.liquibase.enabled=false
# WebSocket Configuration (para testes)
websocket.enabled=false

# Logging Configuration
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.com.challenge.rental_cars_spring_api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
logging.level.org.springframework.boot.test=DEBUG
logging.level.org.springframework.context=INFO
logging.level.org.springframework.beans.factory=INFO

# Test specific configurations
spring.test.database.replace=none
spring.jpa.generate-ddl=true

# Disable unnecessary auto-configurations for tests
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# Disable JMX for tests
spring.jmx.enabled=false

# Disable banner
spring.main.banner-mode=off

# Test performance
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true